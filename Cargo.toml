[package]
name = "sendspin-rs-cli"
version = "0.0.9-beta"
edition = "2024"

[dependencies]
sendspin = "0.3.6"
cpal = "0.17"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tokio-tungstenite = "0.30"
mdns-sd = "0.21"
thiserror = "2"
hostname = "0.4"
parking_lot = "0.12"
toml = "1.1"
dirs = "6.0"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
